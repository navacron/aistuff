<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  h1 {
    color: #ffcc00;
    letter-spacing: 6px;
    margin: 10px 0 4px;
    text-shadow: 0 0 12px #ffcc00;
  }
  #hud {
    display: flex;
    gap: 40px;
    font-size: 18px;
    margin-bottom: 8px;
    color: #ffcc00;
  }
  #wrap { position: relative; }
  canvas {
    background: #000;
    border: 2px solid #1919ff;
    border-radius: 6px;
    box-shadow: 0 0 24px #1919ff66;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.78);
    text-align: center;
  }
  #overlay h2 { font-size: 34px; margin: 0 0 10px; }
  #overlay p { margin: 4px 0; font-size: 16px; }
  .win { color: #00ff66; text-shadow: 0 0 14px #00ff66; }
  .lose { color: #ff4040; text-shadow: 0 0 14px #ff4040; }
  #hint { margin-top: 10px; font-size: 13px; color: #888; }
  button {
    margin-top: 16px;
    padding: 10px 22px;
    font-family: inherit;
    font-size: 16px;
    background: #ffcc00;
    color: #000;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #fff04d; }
</style>
</head>
<body>
  <h1>PAC-MAN</h1>
  <div id="hud">
    <span>SCORE <b id="score">0</b></span>
    <span>LIVES <b id="lives">3</b></span>
  </div>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h2 id="msg"></h2>
      <p id="sub"></p>
      <button id="restart">PLAY AGAIN</button>
    </div>
  </div>
  <div id="hint">Arrow keys or WASD to move &nbsp;•&nbsp; eat all dots &nbsp;•&nbsp; power pellets let you chomp ghosts</div>

<script>
// ---- Maze layout ----------------------------------------------------------
// 1 = wall, 0 = dot, 2 = power pellet, 3 = empty, 4 = ghost gate
const RAW = [
  "1111111111111111111",
  "1000000010000000001",
  "1211101010101011121",
  "1000000000000000001",
  "1011101110111011101",
  "1000100010001000101",
  "1110101110111010111",
  "3331000100010001333",
  "1110101111101010111",
  "1000001311131000001",
  "1110101444101010111",
  "3331000100010001333",
  "1110101110111010111",
  "1000100010001000101",
  "1011101110111011101",
  "1000000000000000001",
  "1210101011101010121",
  "1110001000001000111",
  "1000000010000000001",
  "1111111111111111111",
];

const TILE = 24;
const COLS = RAW[0].length;
const ROWS = RAW.length;

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = COLS * TILE;
canvas.height = ROWS * TILE;

let grid, dotsLeft, score, lives, frightenedTimer, gameState;
const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const overlay = document.getElementById("overlay");
const msgEl = document.getElementById("msg");
const subEl = document.getElementById("sub");

function loadMaze() {
  grid = RAW.map(r => r.split("").map(Number));
  dotsLeft = 0;
  for (const row of grid) for (const c of row) if (c === 0 || c === 2) dotsLeft++;
}

// ---- Entities -------------------------------------------------------------
const START_PAC = { col: 9, row: 15 };
const GHOST_HOME = [
  { col: 8, row: 9, color: "#ff0000" },
  { col: 9, row: 9, color: "#ffb8ff" },
  { col: 10, row: 9, color: "#00ffff" },
  { col: 9, row: 10, color: "#ffb852" },
];

let pac, ghosts;

function resetPositions() {
  pac = {
    x: START_PAC.col * TILE + TILE / 2,
    y: START_PAC.row * TILE + TILE / 2,
    dir: { x: 0, y: 0 },
    want: { x: 0, y: 0 },
    speed: 2,
    mouth: 0,
  };
  ghosts = GHOST_HOME.map((g, i) => ({
    x: g.col * TILE + TILE / 2,
    y: g.row * TILE + TILE / 2,
    dir: { x: 0, y: -1 },
    color: g.color,
    speed: 1.7,
    home: { x: g.col * TILE + TILE / 2, y: g.row * TILE + TILE / 2 },
    releaseAt: i * 40,
    timer: 0,
  }));
}

function newGame() {
  loadMaze();
  score = 0;
  lives = 3;
  frightenedTimer = 0;
  resetPositions();
  gameState = "play";
  overlay.style.display = "none";
  updateHud();
}

function updateHud() {
  scoreEl.textContent = score;
  livesEl.textContent = lives;
}

// ---- Helpers --------------------------------------------------------------
function isWall(col, row) {
  if (row < 0 || row >= ROWS) return true;
  // horizontal wrap tunnels
  if (col < 0 || col >= COLS) return false;
  const v = grid[row][col];
  return v === 1;
}

function tileCenter(x) { return Math.abs((x % TILE) - TILE / 2) < pac.speed; }

function atTileCenter(e) {
  const cx = (e.x - TILE / 2) % TILE;
  const cy = (e.y - TILE / 2) % TILE;
  return Math.abs(cx) < 2 && Math.abs(cy) < 2;
}

function colOf(e) { return Math.floor(e.x / TILE); }
function rowOf(e) { return Math.floor(e.y / TILE); }

function canMove(e, dir) {
  const col = colOf(e), row = rowOf(e);
  return !isWall(col + dir.x, row + dir.y);
}

function wrap(e) {
  if (e.x < 0) e.x = canvas.width;
  if (e.x > canvas.width) e.x = 0;
}

// ---- Input ----------------------------------------------------------------
const KEYS = {
  ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
  ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
  w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
};
window.addEventListener("keydown", (e) => {
  const k = KEYS[e.key] || KEYS[e.key.toLowerCase()];
  if (k) { pac.want = k; e.preventDefault(); }
});

// ---- Pac-Man update -------------------------------------------------------
function updatePac() {
  if (atTileCenter(pac)) {
    pac.x = colOf(pac) * TILE + TILE / 2;
    pac.y = rowOf(pac) * TILE + TILE / 2;
    if (canMove(pac, pac.want)) pac.dir = pac.want;
    if (!canMove(pac, pac.dir)) pac.dir = { x: 0, y: 0 };
  }
  pac.x += pac.dir.x * pac.speed;
  pac.y += pac.dir.y * pac.speed;
  wrap(pac);
  pac.mouth = (pac.mouth + 0.15) % (Math.PI / 2);

  // eat
  const c = colOf(pac), r = rowOf(pac);
  if (grid[r] && (grid[r][c] === 0 || grid[r][c] === 2)) {
    if (grid[r][c] === 2) { frightenedTimer = 7 * 60; score += 50; }
    else score += 10;
    grid[r][c] = 3;
    dotsLeft--;
    updateHud();
    if (dotsLeft === 0) endGame(true);
  }
}

// ---- Ghost AI -------------------------------------------------------------
function updateGhost(g) {
  if (g.releaseAt > 0) { g.releaseAt--; return; }
  if (atTileCenter(g)) {
    g.x = colOf(g) * TILE + TILE / 2;
    g.y = rowOf(g) * TILE + TILE / 2;
    const opts = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }]
      .filter(d => canMove(g, d))
      .filter(d => !(d.x === -g.dir.x && d.y === -g.dir.y) || Math.random() < 0.1);
    if (opts.length) {
      const target = frightenedTimer > 0
        ? { x: -pac.x, y: -pac.y }   // flee
        : { x: pac.x, y: pac.y };    // chase
      opts.sort((a, b) => {
        const da = dist(g.x + a.x * TILE, g.y + a.y * TILE, target.x, target.y);
        const db = dist(g.x + b.x * TILE, g.y + b.y * TILE, target.x, target.y);
        return da - db;
      });
      // mix chase with a little randomness so they aren't perfect
      g.dir = Math.random() < 0.75 ? opts[0] : opts[Math.floor(Math.random() * opts.length)];
    }
  }
  const sp = frightenedTimer > 0 ? g.speed * 0.6 : g.speed;
  g.x += g.dir.x * sp;
  g.y += g.dir.y * sp;
  wrap(g);
}

function dist(x1, y1, x2, y2) { return Math.hypot(x1 - x2, y1 - y2); }

function checkGhostCollisions() {
  for (const g of ghosts) {
    if (dist(pac.x, pac.y, g.x, g.y) < TILE * 0.7) {
      if (frightenedTimer > 0) {
        score += 200;
        updateHud();
        g.x = g.home.x; g.y = g.home.y;
        g.releaseAt = 60;
        g.dir = { x: 0, y: -1 };
      } else {
        loseLife();
        return;
      }
    }
  }
}

function loseLife() {
  lives--;
  updateHud();
  if (lives <= 0) { endGame(false); return; }
  resetPositions();
  frightenedTimer = 0;
}

// ---- Render ---------------------------------------------------------------
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // maze
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const v = grid[r][c];
      const x = c * TILE, y = r * TILE;
      if (v === 1) {
        ctx.fillStyle = "#1919ff";
        ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
        ctx.fillStyle = "#000";
        ctx.fillRect(x + 5, y + 5, TILE - 10, TILE - 10);
      } else if (v === 4) {
        ctx.fillStyle = "#ffb8ff";
        ctx.fillRect(x + 2, y + TILE / 2 - 1, TILE - 4, 2);
      } else if (v === 0) {
        ctx.fillStyle = "#ffd9a0";
        ctx.beginPath();
        ctx.arc(x + TILE / 2, y + TILE / 2, 2.5, 0, Math.PI * 2);
        ctx.fill();
      } else if (v === 2) {
        ctx.fillStyle = "#ffd9a0";
        ctx.beginPath();
        ctx.arc(x + TILE / 2, y + TILE / 2, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // pac-man
  const angle = pac.mouth;
  let facing = 0;
  if (pac.dir.x === 1) facing = 0;
  else if (pac.dir.x === -1) facing = Math.PI;
  else if (pac.dir.y === -1) facing = -Math.PI / 2;
  else if (pac.dir.y === 1) facing = Math.PI / 2;
  ctx.save();
  ctx.translate(pac.x, pac.y);
  ctx.rotate(facing);
  ctx.fillStyle = "#ffcc00";
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, TILE / 2 - 1, angle, Math.PI * 2 - angle);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // ghosts
  for (const g of ghosts) {
    const fr = frightenedTimer > 0;
    const blink = fr && frightenedTimer < 120 && Math.floor(frightenedTimer / 10) % 2 === 0;
    ctx.fillStyle = fr ? (blink ? "#fff" : "#2020ff") : g.color;
    const gx = g.x, gy = g.y, rad = TILE / 2 - 1;
    ctx.beginPath();
    ctx.arc(gx, gy, rad, Math.PI, 0);
    ctx.lineTo(gx + rad, gy + rad);
    for (let i = 0; i < 3; i++) {
      ctx.lineTo(gx + rad - (rad * 2 / 3) * (i + 0.5), gy + rad - 4);
      ctx.lineTo(gx + rad - (rad * 2 / 3) * (i + 1), gy + rad);
    }
    ctx.closePath();
    ctx.fill();
    // eyes
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(gx - 4, gy - 2, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(gx + 4, gy - 2, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = fr ? "#ff4040" : "#0000aa";
    const ex = g.dir.x * 1.5, ey = g.dir.y * 1.5;
    ctx.beginPath(); ctx.arc(gx - 4 + ex, gy - 2 + ey, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(gx + 4 + ex, gy - 2 + ey, 1.5, 0, Math.PI * 2); ctx.fill();
  }
}

// ---- Loop -----------------------------------------------------------------
function loop() {
  if (gameState === "play") {
    updatePac();
    ghosts.forEach(updateGhost);
    checkGhostCollisions();
    if (frightenedTimer > 0) frightenedTimer--;
    draw();
  }
  requestAnimationFrame(loop);
}

function endGame(won) {
  gameState = "over";
  msgEl.textContent = won ? "YOU WIN!" : "GAME OVER";
  msgEl.className = won ? "win" : "lose";
  subEl.textContent = "Final score: " + score;
  overlay.style.display = "flex";
}

document.getElementById("restart").addEventListener("click", newGame);

newGame();
loop();
</script>
</body>
</html>
